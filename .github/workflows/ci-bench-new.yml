name: CI benchmark (new)

# Benchmark-only copy of dd1b982's ci.yml. It runs only on pushes to ci-bench/ab and never
# lands on main; its caches use a separate prefix so they neither read nor feed real CI caches.
on:
  push:
    branches: [ci-bench/ab]

permissions:
  contents: read

concurrency:
  group: ci-bench-new-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debuginfo: the many test binaries link faster and the cache is smaller. Panics still
  # report file:line, and debug assertions and overflow checks stay on.
  CARGO_PROFILE_DEV_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustc -vV
      # Caches only the registry and compiled dependencies, keyed by runner OS/arch, rustc -vV,
      # CARGO*/RUST* env, Cargo.lock and manifests. Workspace crates are pruned before saving, so
      # every run compiles and tests the checked-out source.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          prefix-key: v0-bench2
          cache-bin: "false"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      # nextest runs the test binaries concurrently instead of one after another; it does not run
      # doctests, so cargo test --doc covers those.
      - run: cargo nextest run --locked --workspace --no-fail-fast
      - run: cargo test --locked --workspace --doc --no-fail-fast

  release-scripts:
    name: release packaging tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s scripts/release -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
