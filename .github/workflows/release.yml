name: Release

# Tag pushes build every target and create a draft GitHub release. Manual runs
# and pull requests touching packaging only build and upload workflow artifacts.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/release/**
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-2025 }
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build and package
        run: |
          args=(--target "${{ matrix.target }}" --out-dir dist)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--expect-version "${GITHUB_REF_NAME#v}")
          fi
          python scripts/release/package.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadout-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: assemble SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loadout-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: dist
        run: |
          sha256sum --check --strict ./*.sha256
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft GitHub release
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "loadout $TAG"
          fi
